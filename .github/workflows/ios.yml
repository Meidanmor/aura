name: iOS

# Builds the Capacitor iOS app, runs it in the iOS Simulator (screenshots +
# logs are uploaded as artifacts) and produces an unsigned .ipa for
# sideloading (re-sign it with AltStore, Sideloadly, etc.).
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios.yml'
      - 'src/**'
      - 'src-capacitor/**'
      - '!src-capacitor/android/**'
      - 'quasar.config.js'
      - 'index.html'
      - 'postcss.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/native-icons.mjs'
  pull_request:
    paths:
      - '.github/workflows/ios.yml'
      - 'src-capacitor/ios/**'
      - 'src-capacitor/package*.json'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # Baked into the app bundle at build time (src/boot/native-api.js); the
  # build fails if it's missing. Override with the APP_API_ORIGIN repo variable.
  APP_API_ORIGIN: ${{ vars.APP_API_ORIGIN || 'https://aura-phi-woad.vercel.app' }}
  BUNDLE_ID: com.aura.app
  OUT: ${{ github.workspace }}/ios-out

jobs:
  ios:
    name: iOS ${{ matrix.ios }}
    runs-on: macos-15
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # latest: the newest runtime on the runner, on a notched iPhone.
        # 16.4: the oldest iOS we test, on an iPhone 8 (its last major iOS).
        ios: ['latest', '16.4']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-capacitor/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix src-capacitor

      - name: Toolchain
        run: |
          mkdir -p "$OUT/logs" "$OUT/screenshots"
          xcodebuild -version
          pod --version
          node --version
          xcrun simctl list runtimes

      # Icons + Quasar web build + `cap sync ios` (runs pod install).
      - name: Build web app and sync iOS project
        run: npm run build:ios

      # Firebase config, from the GOOGLE_SERVICE_INFO_PLIST secret (the file,
      # base64-encoded; it's kept out of git). Without it the app is built
      # without Firebase and the push self-test is skipped.
      - name: Add Firebase config
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$PLIST_B64" ]; then
            echo "::warning::No GOOGLE_SERVICE_INFO_PLIST secret: building without Firebase."
            exit 0
          fi
          DEST=src-capacitor/ios/App/App/GoogleService-Info.plist
          # Accept the raw file too, and certutil output with its BEGIN/END lines.
          if printf '%s' "$PLIST_B64" | head -c 100 | grep -q '<?xml'; then
            printf '%s' "$PLIST_B64" > "$DEST"
          else
            printf '%s' "$PLIST_B64" | grep -v -- '-----' | tr -d ' \r\n' | base64 -D > "$DEST"
          fi
          plutil -lint "$DEST"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$DEST")
          PROJECT=$(/usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' "$DEST")
          echo "Firebase project: $PROJECT, iOS app: $BUNDLE"
          if [ "$BUNDLE" != "$BUNDLE_ID" ]; then
            echo "::error::GoogleService-Info.plist is for the iOS app '$BUNDLE', not '$BUNDLE_ID'. Download it for $BUNDLE_ID in the Firebase console."
            exit 1
          fi
          echo "FIREBASE=1" >> "$GITHUB_ENV"

      - name: Install the iOS ${{ matrix.ios }} simulator runtime
        if: matrix.ios != 'latest'
        run: |
          if xcrun simctl list runtimes | grep -q "iOS ${{ matrix.ios }} "; then exit 0; fi
          xcodebuild -downloadPlatform iOS -buildVersion "${{ matrix.ios }}" \
            || xcodes runtimes install "iOS ${{ matrix.ios }}"
          xcrun simctl list runtimes

      - name: Pick a simulator
        env:
          IOS: ${{ matrix.ios }}
        run: |
          UDID=$(python3 - <<'PY'
          import json, os, subprocess, sys
          want = os.environ["IOS"]
          j = lambda *a: json.loads(subprocess.check_output(["xcrun", "simctl", "list", *a, "-j"]))
          if want == "latest":
              devs = j("devices", "available")["devices"]
              ios = sorted((k for k in devs if "iOS" in k),
                           key=lambda k: [int(p) for p in k.rsplit("iOS-", 1)[1].split("-")])
              for runtime in reversed(ios):
                  phones = [d for d in devs[runtime] if d["name"].startswith("iPhone")]
                  # Prefer a notched / Dynamic Island model (safe areas) over the SE.
                  phones.sort(key=lambda d: ("SE" in d["name"], d["name"]))
                  if phones:
                      print(phones[0]["udid"]); print(phones[0]["name"], runtime, file=sys.stderr); break
          else:
              runtime = next(r for r in j("runtimes")["runtimes"]
                             if r["platform"] == "iOS" and r["version"].startswith(want) and r["isAvailable"])
              names = [d["name"] for d in runtime["supportedDeviceTypes"]]
              model = next(n for n in ("iPhone 8", "iPhone SE (2nd generation)", "iPhone SE (3rd generation)") if n in names)
              udid = subprocess.check_output(["xcrun", "simctl", "create", model, model, runtime["identifier"]], text=True).strip()
              print(udid); print(model, runtime["identifier"], file=sys.stderr)
          PY
          )
          test -n "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build for the simulator
        working-directory: src-capacitor/ios/App
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace App.xcworkspace -scheme App -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/sim \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            CODE_SIGN_ENTITLEMENTS="$PWD/App/App.entitlements" \
            | tee "$OUT/logs/xcodebuild-simulator.log" | grep -E '^(\*\*|error:|.*: error:|.*: warning: )' || true
          # (the grep above only filters the output; this is the real check)
          grep -q '^\*\* BUILD SUCCEEDED \*\*' "$OUT/logs/xcodebuild-simulator.log"
          # Simulator builds carry their entitlements in the binary's
          # __TEXT,__entitlements section, not in the code signature.
          if strings -a build/sim/Build/Products/Debug-iphonesimulator/App.app/App | grep -q '<key>aps-environment</key>'; then
            echo "Simulator app has the aps-environment (push) entitlement."
          else
            echo "::error::The simulator app is missing the aps-environment entitlement."; exit 1
          fi

      - name: Run in the simulator
        run: |
          APP=src-capacitor/ios/App/build/sim/Build/Products/Debug-iphonesimulator/App.app
          LOGS="$OUT/logs"; SHOTS="$OUT/screenshots"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"

          # System log for the app process (WebKit, networking, crashes).
          xcrun simctl spawn "$UDID" log stream --level debug --style compact \
            --predicate 'process == "App" OR subsystem == "com.apple.WebKit"' \
            > "$LOGS/simulator-system.log" 2>&1 &
          LOG_PID=$!

          # stdout/stderr carry Capacitor's bridge + JS console output (⚡️ ...)
          # in Debug builds. A pty + NSUnbufferedIO keep Swift's print() from
          # sitting in a buffer that is never flushed.
          launch() {
            out=$1; shift
            SIMCTL_CHILD_NSUnbufferedIO=YES xcrun simctl launch --console-pty \
              --terminate-running-process "$UDID" "$BUNDLE_ID" "$@" > "$out" 2>&1 &
          }
          # Wait until the app is really running. A launch right after boot can
          # land before SpringBoard is ready to bring an app to the foreground:
          # the process starts but never runs. If so, relaunch once.
          started() {
            for _ in $(seq 30); do
              grep -q 'Loading app at' "$1" && return 0
              sleep 1
            done
            return 1
          }
          # Three cold starts, like a user opening the app on different days:
          # the 1st has no saved data; the 2nd and 3rd start with what the
          # earlier runs saved (offline copies in IndexedDB, cookies, cache).
          for n in 1 2 3; do
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            launch "$LOGS/app-console-$n.log"
            if ! started "$LOGS/app-console-$n.log" && [ $n = 1 ]; then
              echo "::warning::The app didn't start within 30s of the first launch; relaunching."
              xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
              mv "$LOGS/app-console-1.log" "$LOGS/app-console-1-first-attempt.log"
              launch "$LOGS/app-console-1.log"
              started "$LOGS/app-console-1.log" || true
            fi
            # Long enough for the background sync of offline copies (starts 4s
            # after the first live response) to finish before the next start.
            prev=0
            for t in 5 15 30 45; do
              sleep $(( t - prev )); prev=$t
              xcrun simctl io "$UDID" screenshot "$SHOTS/launch$n-${t}s.png"
            done
          done

          # Push self-test (needs Firebase): a debug launch with -PushSelfTest
          # registers with APNs (the simulator signs with the push entitlement
          # locally, no Apple account needed) and asks Firebase for the FCM
          # token the backend sends to. See AppDelegate.swift.
          if [ "${FIREBASE:-}" = 1 ]; then
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            launch "$LOGS/app-console-push.log" -PushSelfTest
            for _ in $(seq 60); do
              grep -qE 'FCM token (received|failed)|APNs registration failed' "$LOGS/app-console-push.log" && break
              sleep 1
            done
            sleep 2
            # The simulator gets APNs tokens through the host's push daemon.
            log show --last 3m --style compact --predicate 'process == "apsd"' > "$LOGS/host-apsd.log" 2>&1 || true
          fi

          # Where are the app and its web content processes spending their
          # time? (Stacks for diagnosing hangs; simulator apps are host processes.)
          for proc in "$(pgrep -f 'CoreSimulator/Devices/.*/App.app/App$' | head -1)" $(pgrep -f 'com.apple.WebKit.WebContent' || true); do
            [ -n "$proc" ] && sample "$proc" 2 -mayDie -file "$LOGS/sample-$proc.txt" >/dev/null 2>&1 || true
          done

          # Still alive?
          if xcrun simctl spawn "$UDID" launchctl list | grep -q "UIKitApplication:$BUNDLE_ID"; then
            echo "App is running." | tee "$LOGS/status.txt"
          else
            echo "App is NOT running (crashed or exited)." | tee "$LOGS/status.txt"
          fi

          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          sleep 2
          kill "$LOG_PID" || true
          cp ~/Library/Logs/DiagnosticReports/App[-_]*.ips "$LOGS/" 2>/dev/null || true

      - name: Check the simulator run
        run: |
          LOGS="$OUT/logs"
          for f in "$LOGS"/app-console*.log; do
            echo "::group::$(basename "$f")"; cat "$f"; echo "::endgroup::"
          done
          fail=0
          if ! grep -q "App is running" "$LOGS/status.txt"; then
            echo "::error::The app is not running at the end of the simulator run."; fail=1
          fi
          if ls "$LOGS"/*.ips >/dev/null 2>&1; then
            echo "::error::Crash report(s) found: $(ls "$LOGS"/*.ips)"; fail=1
          fi
          # Proof the web app booted, on every launch: the bridge loaded the
          # page and JS hid the splash (MainLayout's hydration).
          for f in "$LOGS"/app-console-1.log "$LOGS"/app-console-2.log "$LOGS"/app-console-3.log; do
            for want in 'Loading app at' 'To Native -> +SplashScreen hide'; do
              if ! grep -qE "$want" "$f"; then
                echo "::error::$(basename "$f"): expected a line matching '$want'."; fail=1
              fi
            done
          done
          # ...and finished starting with live content: the app's startup
          # watchdog (src/utils/startup-watchdog.js) logs every startup request
          # with its outcome once the app is ready.
          for f in "$LOGS"/app-console-1.log "$LOGS"/app-console-2.log "$LOGS"/app-console-3.log; do
            if ! grep -q '\[startup\] ready' "$f"; then
              echo "::error::$(basename "$f"): the app never reported '[startup] ready'."; fail=1
            elif ! grep '\[startup\] ready' "$f" | grep -qE '/config/[a-z]+\.json → 200'; then
              echo "::error::$(basename "$f"): no /config JSON loaded during startup (see the [startup] line)."; fail=1
            elif grep '\[startup\] ready' "$f" | grep -q 'offline ('; then
              echo "::error::$(basename "$f"): startup fell back to offline copies — the live storefront didn't answer."; fail=1
            fi
          done
          # Push self-test results.
          if [ "${FIREBASE:-}" = 1 ]; then
            P="$LOGS/app-console-push.log"
            grep '\[push-selftest\]' "$P" || true
            if ! grep -q 'firebase configured: yes' "$P"; then
              echo "::error::Firebase didn't start with the bundled GoogleService-Info.plist."; fail=1
            elif ! grep -q 'Firebase installation ID received' "$P"; then
              echo "::error::Firebase rejected the app: $(grep -o 'Firebase installation failed.*' "$P" || echo 'no answer within 60s'). Check the plist's API key / app ID."; fail=1
            elif grep -q 'APNs registration failed' "$P"; then
              echo "::error::$(grep -o 'APNs registration failed.*' "$P")"; fail=1
            elif ! grep -q 'APNs token received' "$P"; then
              # No answer at all (not an error from iOS): the simulator couldn't
              # reach Apple's push service from this CI machine.
              echo "::warning::Firebase is set up and accepted the app, but APNs never answered the simulator's registration, so the FCM token step couldn't run here."
              echo "::group::Push diagnostics (host apsd, app push logs)"
              tail -40 "$LOGS/host-apsd.log" 2>/dev/null | cut -c1-300 || true
              grep -aiE 'apns|aps-|remote ?notif|push' "$LOGS/simulator-system.log" | grep -v WebKit | tail -40 | cut -c1-300 || true
              echo "::endgroup::"
            elif ! grep -q 'FCM token received' "$P"; then
              echo "::error::APNs token issued, but no FCM token: $(grep -o 'FCM token failed.*' "$P" || echo 'no answer within 60s')"; fail=1
            else
              echo "Push self-test passed: Firebase configured and accepted the app, APNs token issued, FCM token received."
            fi
          fi
          # JS errors surfaced by the Capacitor bridge, and failed page loads.
          if grep -nE '⚡️ +\[error\]|ERROR MESSAGE:|Uncaught|Unhandled|APP_API_ORIGIN is not set|WebView failed|Error loading page|\[startup\] not ready' "$LOGS"/app-console*.log; then
            echo "::error::Errors in the app console (see above)."; fail=1
          fi
          if [ $fail = 1 ]; then
            echo "::group::System log (errors, faults, WebKit/JS)"
            grep -aiE 'error|fault|fail|exception|terminat|JavaScript|WebContent|deadlock|hang' "$LOGS/simulator-system.log" | cut -c1-400 | tail -150 || true
            echo "::endgroup::"
            for f in "$LOGS"/sample-*.txt; do
              [ -f "$f" ] || continue
              echo "::group::$(basename "$f") (main/JS threads)"
              sed -n '1,12p' "$f"
              awk '/Call graph:/{p=1} p' "$f" | grep -vE '^\s*$' | head -120 | cut -c1-220
              echo "::endgroup::"
            done
          fi
          exit $fail

      # Small JPEG previews in the job log, so a run can be eyeballed (or
      # checked by tooling) without downloading the artifact.
      - name: Screenshot previews (base64)
        if: always()
        run: |
          for f in "$OUT"/screenshots/*.png; do
            [ -f "$f" ] || continue
            sips -s format jpeg -s formatOptions 35 -Z 480 "$f" --out "${f%.png}.preview.jpg" >/dev/null
            echo "::group::$(basename "$f")"
            echo "PREVIEW $(basename "$f") $(base64 -i "${f%.png}.preview.jpg" | tr -d '\n')"
            echo "::endgroup::"
            rm "${f%.png}.preview.jpg"
          done

      - name: Build unsigned .ipa
        if: (success() || failure()) && matrix.ios == 'latest'
        working-directory: src-capacitor/ios/App
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee "$OUT/logs/xcodebuild-archive.log" | grep -E '^(\*\*|error:|.*: error:)' || true
          grep -q '^\*\* ARCHIVE SUCCEEDED \*\*' "$OUT/logs/xcodebuild-archive.log"
          APP=build/App.xcarchive/Products/Applications/App.app
          test -d "$APP"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry "$OUT/AuraSampleShop-unsigned.ipa" Payload)
          ls -l "$OUT/AuraSampleShop-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshots-${{ matrix.ios }}
          path: ios-out/screenshots
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-logs-${{ matrix.ios }}
          path: ios-out/logs
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always() && matrix.ios == 'latest'
        with:
          name: AuraSampleShop-unsigned-ipa
          path: ios-out/AuraSampleShop-unsigned.ipa
          if-no-files-found: warn
